<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>评语分析</title>
    <style>
      :root {
        --blue: #5b86ff;
        --blue-strong: #356dff;
        --blue-soft: #eef4ff;
        --bg: #f6f8fc;
        --surface: #ffffff;
        --line: #e2e8f0;
        --line-soft: #edf1f7;
        --text: #0f172a;
        --muted: #64748b;
        --hint: #94a3b8;
        --disabled: #cbd5e1;
        --green: #16a34a;
        --green-soft: #effdf4;
        --green-line: #b7f2cc;
        --red: #ef4444;
        --red-soft: #fff3f3;
        --red-line: #ffc7c7;
        --shadow: 0 14px 34px rgba(15, 23, 42, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 1180px;
        color: var(--text);
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      body.screenshot-bg {
        min-height: 100vh;
        overflow: hidden;
        background: #f5f8fd;
      }

      body.screenshot-bg .app {
        display: none;
      }

      .base-screenshot {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: fill;
        object-position: center top;
        image-rendering: auto;
        pointer-events: none;
        user-select: none;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 176px;
        flex: 0 0 176px;
        padding: 20px 16px;
        color: #fff;
        background: linear-gradient(180deg, #5b86ff 0%, #3f70f4 100%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        margin-bottom: 30px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 9px;
        color: var(--blue);
        background: #fff;
        font-weight: 800;
      }

      .brand-text {
        line-height: 1.15;
        font-weight: 700;
      }

      .brand-text span {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0.76;
      }

      .nav {
        display: grid;
        gap: 8px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 42px;
        padding: 0 12px;
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
      }

      .nav-item.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.18);
      }

      .nav svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.2;
      }

      .shell {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .system-title {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        font-weight: 800;
      }

      .system-title .sub {
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }

      .user-box {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #334155;
        font-size: 14px;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #fff;
        background: var(--blue);
        font-weight: 700;
      }

      .main {
        flex: 1;
        padding: 26px 30px 34px;
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      h1 {
        margin: 0;
        color: #111827;
        font-size: 28px;
        line-height: 1.2;
      }

      .head-actions {
        display: flex;
        gap: 12px;
        padding-top: 4px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 96px;
        height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        color: #334155;
        background: #e8edf5;
        font-weight: 700;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      }

      .btn.primary {
        color: #fff;
        background: var(--blue);
      }

      .btn.primary:hover:not(:disabled) {
        background: var(--blue-strong);
      }

      .btn.ghost {
        color: #334155;
        background: #f1f5f9;
      }

      .btn:disabled,
      .btn.primary:disabled {
        color: #f8fafc;
        background: var(--disabled);
        box-shadow: none;
        transform: none;
      }

      .btn svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.2;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 74px;
        padding: 0 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .stat span {
        color: var(--muted);
        font-size: 14px;
      }

      .stat strong {
        color: #111827;
        font-size: 28px;
      }

      .student-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .student-panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .student-form {
        padding: 20px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .student-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .student-title .bar {
        width: 6px;
        height: 22px;
        border-radius: 999px;
        background: var(--blue);
      }

      .student-title h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        color: var(--muted);
        background: #f1f5f9;
        font-size: 13px;
        font-weight: 700;
      }

      .chip.done {
        color: var(--green);
        background: #dcfce7;
      }

      .identity-grid {
        display: grid;
        grid-template-columns: 1.12fr 1.12fr 0.78fr 0.78fr;
        gap: 12px;
        margin-bottom: 14px;
      }

      .field label,
      .comment-field label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 700;
      }

      .control {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        outline: none;
        color: #111827;
        background: #fff;
        transition:
          border 0.15s ease,
          box-shadow 0.15s ease;
      }

      .control::placeholder,
      textarea::placeholder {
        color: #a3adbc;
      }

      .control:focus,
      textarea:focus,
      .result-text:focus,
      .code-input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(91, 134, 255, 0.16);
      }

      select.control {
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #64748b 50%),
          linear-gradient(135deg, #64748b 50%, transparent 50%);
        background-position:
          calc(100% - 16px) 15px,
          calc(100% - 10px) 15px;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        outline: none;
        color: #111827;
        background: #fff;
        line-height: 1.65;
      }

      .form-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
      }

      .counter {
        display: inline-flex;
        align-items: center;
        height: 30px;
        padding: 0 10px;
        border-radius: 8px;
        color: #8fa0b8;
        background: #f3f7fc;
        font-size: 13px;
      }

      .analysis-card {
        margin: 0 20px 20px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        background: #fbfdff;
      }

      .empty-state {
        display: grid;
        min-height: 208px;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .empty-icon {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin: 0 auto 14px;
        border-radius: 16px;
        color: var(--blue);
        background: var(--blue-soft);
      }

      .empty-icon svg {
        width: 28px;
        height: 28px;
        stroke-width: 2.2;
      }

      .empty-state h3 {
        margin: 0 0 6px;
        color: #334155;
        font-size: 18px;
      }

      .empty-state p {
        margin: 0;
        color: var(--hint);
        font-size: 14px;
      }

      .result-wrap {
        padding: 18px;
      }

      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .result-title {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #334155;
        font-size: 18px;
        font-weight: 800;
      }

      .spark {
        color: #9b5cff;
      }

      .copy-btn {
        min-width: 138px;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .competency {
        padding: 16px;
        border-radius: 12px;
      }

      .competency.positive {
        border: 1px solid var(--green-line);
        background: var(--green-soft);
      }

      .competency.negative {
        border: 1px solid var(--red-line);
        background: var(--red-soft);
      }

      .competency h3 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      .positive h3,
      .positive .code-label {
        color: var(--green);
      }

      .negative h3,
      .negative .code-label {
        color: var(--red);
      }

      .result-text {
        width: 100%;
        min-height: 260px;
        border-radius: 8px;
        line-height: 1.62;
        font-size: 16px;
      }

      .positive .result-text,
      .positive .code-input {
        border-color: var(--green-line);
        background: rgba(255, 255, 255, 0.55);
      }

      .negative .result-text,
      .negative .code-input {
        border-color: var(--red-line);
        background: rgba(255, 255, 255, 0.55);
      }

      .code-label {
        display: block;
        margin: 14px 0 8px;
        font-size: 14px;
        font-weight: 800;
      }

      .code-input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid;
        border-radius: 7px;
        outline: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
      }

      .ai-service {
        position: fixed;
        right: 24px;
        bottom: 20px;
        z-index: 30;
      }

      .ai-launcher {
        display: inline-grid;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        padding: 0;
        border-radius: 50%;
        color: #fff;
        background: transparent;
        box-shadow: 0 16px 34px rgba(53, 109, 255, 0.28);
      }

      .ai-launcher img {
        width: 54px;
        height: 54px;
        display: block;
      }

      .ai-service svg {
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .assistant-icon svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.35;
      }

      .assistant-icon img {
        width: 34px;
        height: 34px;
        display: block;
      }

      .ai-window-btn svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.05;
      }

      .send-btn svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.2;
      }

      .ai-panel {
        position: absolute;
        right: 0;
        bottom: 64px;
        display: none;
        width: 432px;
        height: min(640px, calc(100vh - 104px));
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 28px 70px rgba(15, 23, 42, 0.2);
      }

      .ai-service.open .ai-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }

      .ai-service.open:not(.expanded) .ai-history {
        display: none;
      }

      .ai-service.open:not(.expanded).history-open .ai-history {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        border-right: 0;
        background: #fff;
      }

      .ai-service.open:not(.expanded).history-open [data-ai-collapse] {
        display: inline-grid;
      }

      .ai-service.expanded.open .ai-panel {
        grid-template-columns: minmax(0, 1fr);
      }

      .ai-service.expanded.open .ai-history {
        display: none;
      }

      .ai-service.history-collapsed.open .ai-panel {
        grid-template-columns: minmax(0, 1fr);
      }

      .ai-service.history-collapsed .ai-history {
        display: none;
      }

      .ai-service.expanded {
        inset: 0;
        pointer-events: none;
      }

      .ai-service.expanded .ai-launcher {
        display: none;
      }

      .ai-service.expanded .ai-panel {
        left: 50%;
        right: auto;
        bottom: 40px;
        width: min(1280px, calc(100vw - 80px));
        height: calc(100vh - 80px);
        transform: translateX(-50%);
        pointer-events: auto;
      }

      .ai-history {
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 18px;
        border-right: 1px solid var(--line-soft);
        background: linear-gradient(180deg, #f8fbff 0%, #f6f8fc 100%);
      }

      .ai-history-head,
      .ai-chat-head,
      .ai-answer-head,
      .source-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ai-history-title {
        color: #111827;
        font-size: 18px;
        font-weight: 800;
      }

      .ai-window-btn {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        color: #475569;
        background: transparent;
      }

      .ai-window-btn:hover {
        background: #eef3fb;
      }

      .new-question {
        width: 100%;
        height: 44px;
        margin: 20px 0 14px;
      }

      .ai-search {
        position: relative;
        margin-bottom: 18px;
      }

      .ai-search svg {
        position: absolute;
        left: 12px;
        top: 50%;
        width: 17px;
        height: 17px;
        color: #9aa8ba;
        stroke-width: 2;
        transform: translateY(-50%);
      }

      .ai-search input {
        width: 100%;
        height: 38px;
        padding: 0 12px 0 38px;
        border: 1px solid #d9e1ec;
        border-radius: 9px;
        outline: none;
        color: #334155;
        background: #fff;
      }

      .history-group {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 800;
      }

      .history-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 14px;
        color: #334155;
        font-size: 14px;
        line-height: 1.45;
        cursor: pointer;
        transition: color 0.15s ease;
      }

      .history-item:hover {
        color: var(--blue-strong);
      }

      .history-item.hidden {
        display: none;
      }

      .history-dot {
        display: grid;
        place-items: center;
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        margin-top: 1px;
        border: 1px solid #80a3ff;
        border-radius: 50%;
        color: var(--blue);
        font-size: 10px;
        font-weight: 900;
      }

      .ai-chat {
        display: flex;
        min-width: 0;
        min-height: 0;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
        background: #fff;
      }

      .ai-service.open:not(.expanded) .ai-chat {
        position: relative;
      }

      .ai-service.expanded .ai-chat {
        position: relative;
      }

      .ai-chat-head {
        flex: 0 0 58px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line-soft);
      }

      .ai-service.open:not(.expanded) .ai-chat-head {
        flex-basis: 56px;
        padding: 0 12px 0 16px;
      }

      .assistant-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 800;
      }

      .ai-service.open:not(.expanded) .assistant-title {
        font-size: 16px;
      }

      .assistant-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #fff;
        background: transparent;
      }

      .ai-service.open:not(.expanded) .assistant-icon {
        width: 30px;
        height: 30px;
      }

      .ai-service.open:not(.expanded) .assistant-icon img {
        width: 30px;
        height: 30px;
      }

      .ai-service.open:not(.expanded) [data-ai-collapse] {
        display: none;
      }

      .ai-window-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .ai-chat-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 18px;
        background:
          radial-gradient(circle at 78% 0%, rgba(91, 134, 255, 0.1), transparent 28%),
          #fff;
      }

      .ai-service.open:not(.expanded) .ai-chat-body {
        padding: 18px 16px 184px;
      }

      .ai-service.expanded .ai-chat-body {
        padding-bottom: 250px;
      }

      .conversation-messages {
        display: grid;
        gap: 14px;
      }

      .assistant-welcome {
        padding: 8px 2px 4px;
      }

      .assistant-welcome h2 {
        margin: 0 0 10px;
        color: #637dff;
        font-size: 23px;
        line-height: 1.25;
      }

      .assistant-welcome p {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
      }

      .quick-question-grid {
        display: grid;
        gap: 10px;
        margin-top: 8px;
      }

      .quick-question-card {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        min-height: 70px;
        padding: 12px 13px;
        border: 1px solid #edf2f8;
        border-radius: 13px;
        color: #1f2937;
        background: #fff;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
        text-align: left;
      }

      .quick-question-card:hover {
        border-color: #c8d7ff;
        background: #f8fbff;
      }

      .quick-icon {
        display: grid;
        place-items: center;
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        color: var(--blue);
        background: var(--blue-soft);
      }

      .quick-icon svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.35;
      }

      .quick-question-card strong {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
      }

      .quick-question-card span:last-child {
        color: #64748b;
        font-size: 12px;
        line-height: 1.35;
      }

      .user-bubble {
        width: fit-content;
        max-width: 76%;
        margin-left: auto;
        padding: 12px 16px;
        border-radius: 16px 16px 4px 16px;
        color: #1f2937;
        background: #eef4ff;
        line-height: 1.5;
      }

      .ai-service.open:not(.expanded) .user-bubble {
        max-width: 88%;
        padding: 10px 12px;
        border-radius: 14px 14px 4px 14px;
        font-size: 14px;
      }

      .assistant-response {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .ai-service.open:not(.expanded) .assistant-response {
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 8px;
        margin-top: 12px;
      }

      .response-avatar {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        color: #fff;
        background: #6f95ff;
      }

      .response-avatar svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.15;
      }

    <script>
      const samples = {
        1: {
          positive:
            "**知识应用（KNO）**\n1. OB KNO.3 展示有关物理环境、空中交通环境（包括航线、天气、机场和运行基础设施）的知识：对进离场程序熟悉，航前准备充分。\n\n**人工航径管理（FPM）**\n1. OB FPM.1 根据情况，准确、平稳地人工控制飞机：侧风着陆过程中，能够及时修正偏差，保持稳定的进近航径。\n\n**程序应用和遵守规章（PRO）**\n1. OB PRO.2 及时应用相关的运行规定、程序和技术：复飞程序执行果断，符合标准操作程序要求。",
          negative:
            "**情景意识与信息管理（SAW）**\n1. OB SAW.1 监控并评估飞机及系统的状态：下降阶段对速度趋势关注不足，偏差出现后提醒略有滞后。\n\n**沟通（COM）**\n1. OB COM.3 清晰、准确、简洁地传递信息：驾驶舱内关键动作通报可进一步提前，减少后续修正压力。",
          positiveCodes: "OB KNO.3, OB FPM.1, OB PRO.2",
          negativeCodes: "OB SAW.1, OB COM.3",
        },
        2: {
          positive:
            "**人工航径管理（FPM）**\n1. OB FPM.1 根据情况，准确、平稳地人工控制飞机：进近过程中操纵动作柔和，修正及时，能够保持稳定航径。\n\n**沟通（COM）**\n1. OB COM.9 遵守标准的无线电通话用语和程序：与塔台沟通顺畅，无线电通话用语规范。\n\n**领导力与团队合作（LTW）**\n1. OB LTW.2 主动共享信息并支持团队决策：能及时向机组同步关键状态变化。",

          positiveCodes: "OB FPM.1, OB COM.9, OB LTW.2",
          negativeCodes: "OB SAW.7, OB PRO.2",
        },
      };

      const emptyState = `
        <div class="empty-state">
          <div>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">

                <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z" />
              </svg>
            </div>
            <h3>尚未分析</h3>
            <p>暂无 AI 分析结果</p>
          </div>
        </div>
      `;

      function getPanel(id) {
        return document.querySelector(`[data-student="${id}"]`);
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
      }

      function updateProgress() {
        const total = document.querySelectorAll("[data-student]").length;
        const done = document.querySelectorAll("[data-status].done").length;
        document.getElementById("totalCount").textContent = total;
        document.getElementById("doneCount").textContent = done;
        document.getElementById("todoCount").textContent = total - done;
        document.getElementById("submitAll").disabled = done !== total;
      }

      function updatePanelState(panel) {
        const textarea = panel.querySelector('[data-field="comment"]');
        const button = panel.querySelector("[data-analyze]");
        const counter = panel.querySelector("[data-counter]");
        const length = textarea.value.trim().length;
        counter.textContent = `${textarea.value.length} / 3000 字`;
        button.disabled = length === 0;
        button.textContent = length > 0 ? "AI分析" : "填写评语后可分析";
      }

      function renderResult(id) {
        const data = samples[id];
        const panel = getPanel(id);
        const analysis = panel.querySelector("[data-analysis]");
        const status = panel.querySelector("[data-status]");
        analysis.innerHTML = `
          <div class="result-wrap">
            <div class="result-head">
              <div class="result-title">
                <svg class="spark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor">
                  <path d="M12 3l1.8 4.7L18 9.5l-4.2 1.8L12 16l-1.8-4.7L6 9.5l4.2-1.8L12 3Z" />
                  <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z" />
                </svg>
                AI 分析结果（可编辑）
              </div>
              <button class="btn copy-btn" data-copy="${id}" data-testid="copy-${id}" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <rect x="9" y="9" width="11" height="11" rx="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
                复制分析结果
              </button>
            </div>
            <div class="result-grid">
              <section class="competency positive">
                <h3>正向胜任力</h3>
                <textarea class="result-text" data-result="positive">${data.positive}</textarea>
                <label class="code-label">正向分类（OB代码）</label>
                <input class="code-input" data-code="positive" value="${data.positiveCodes}" />
              </section>
              <section class="competency negative">
                <h3>负向胜任力</h3>
                <textarea class="result-text" data-result="negative">${data.negative}</textarea>
                <label class="code-label">负向分类（OB代码）</label>
                <input class="code-input" data-code="negative" value="${data.negativeCodes}" />
              </section>
            </div>
          </div>
        `;
        status.textContent = "已分析";
        status.classList.add("done");
        updateProgress();
        showToast(`学员${id}已生成 AI 分析结果`);
      }

      function resetPanel(id) {
        const panel = getPanel(id);
        panel.querySelectorAll("input, textarea").forEach((node) => {
          node.value = "";
        });
        panel.querySelectorAll("select").forEach((node) => {
          node.value = "";
        });
        panel.querySelector("[data-analysis]").innerHTML = emptyState;
        const status = panel.querySelector("[data-status]");
        status.textContent = "尚未分析";
        status.classList.remove("done");
        updatePanelState(panel);
        updateProgress();
      }

      function buildCopyText(id) {
        const panel = getPanel(id);
        const name = panel.querySelector('[data-field="name"]').value.trim() || `学员${id}`;
        const positive = panel.querySelector('[data-result="positive"]')?.value || "";
        const negative = panel.querySelector('[data-result="negative"]')?.value || "";
        const positiveCodes = panel.querySelector('[data-code="positive"]')?.value || "";
        const negativeCodes = panel.querySelector('[data-code="negative"]')?.value || "";
        return [
          `${name} AI 分析结果`,
          "",
          "正向胜任力",
          positive,
          `正向分类（OB代码）：${positiveCodes}`,
          "",
          "负向胜任力",
          negative,
          `负向分类（OB代码）：${negativeCodes}`,
        ].join("\n");
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.style.position = "fixed";
          helper.style.left = "-9999px";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }
      }

      document.querySelectorAll("[data-student]").forEach((panel) => {
        panel.addEventListener("input", () => updatePanelState(panel));
        panel.addEventListener("change", () => updatePanelState(panel));
      });

      function findActionTarget(target) {
        if (!(target instanceof Element)) return null;
        return target.closest("[data-analyze], [data-reset], [data-copy]");
      }

      async function runAction(actionTarget) {
        if (!actionTarget || actionTarget.disabled) return;

        const analyzeId = actionTarget.dataset.analyze;
        if (analyzeId) {
          renderResult(analyzeId);
          return;
        }

        const resetId = actionTarget.dataset.reset;
        if (resetId) {
          resetPanel(resetId);
          showToast(`学员${resetId}已重置`);
          return;
        }

        const copyId = actionTarget.dataset.copy;
        if (copyId) {
          await copyText(buildCopyText(copyId));
          actionTarget.textContent = "已复制";
          window.setTimeout(() => {
            actionTarget.innerHTML = `
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              复制分析结果
            `;
          }, 1600);
          showToast(`学员${copyId}分析结果已复制`);
        }
      }

      document.addEventListener("click", async (event) => {
        await runAction(findActionTarget(event.target));
      });

      document.addEventListener("keydown", async (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const actionTarget = findActionTarget(event.target);
        if (!actionTarget) return;
        event.preventDefault();
        await runAction(actionTarget);
      });

      const aiService = document.getElementById("aiService");
      const aiQuestion = document.getElementById("aiQuestion");
      const aiChatBody = document.querySelector(".ai-chat-body");
      const conversationMessages = document.getElementById("conversationMessages");
      const activeModel = document.getElementById("activeModel");
      const imageUpload = document.getElementById("imageUpload");
      const uploadChip = document.getElementById("uploadChip");
      const modelPicker = document.getElementById("modelPicker");

      const answerRows = [
        ["1", "2025-03-25", "43.9099"],
        ["2", "2025-03-12", "34.4228"],
        ["3", "2025-02-27", "32.2066"],
        ["4", "2025-02-14", "31.9046"],
        ["5", "2025-02-13", "26.3731"],
      ];

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => {
          const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
          return map[char];
        });
      }

      function createHistoryItem(question) {
        const item = document.createElement("div");
        item.className = "history-item";
        item.tabIndex = 0;
        item.innerHTML = `<span class="history-dot">AI</span><span>${escapeHtml(question)}</span>`;
        document.querySelector(".history-group").after(item);
        return item;
      }

      function answerCardHtml(question) {
        const safeQuestion = escapeHtml(question);
        const rows = answerRows
          .map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`)
          .join("");
        return `
          <div class="assistant-response">
            <div class="response-avatar">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor">
                <rect x="4" y="7" width="16" height="11" rx="3" />
                <path d="M9 7V4h6v3M8 12h.01M12 12h.01M16 12h.01" />
              </svg>
            </div>
            <div class="response-card">
              <div class="result-ready">分析完毕（用时15秒）</div>
              <div class="ai-answer-head">
                <strong>${safeQuestion}：</strong>
                <div class="view-toggle" aria-label="结果视图切换">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path d="M4 5h16M4 12h16M4 19h16M9 5v14M15 5v14" />
                    </svg>
                  </button>
                  <button data-view="chart" type="button" title="趋势图">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path d="M4 19V5" />
                      <path d="M4 19h16" />
                      <path d="M7 15l4-5 3 3 5-7" />
                    </svg>
                  </button>
                </div>
              </div>
              <table class="answer-table">
                <thead>
                  <tr><th>序号</th><th>航班日期</th><th>拉平高度</th></tr>
                </thead>

                <div class="bar-col"><span style="height: 72%"></span><span>03-12</span></div>

                <div class="bar-col"><span style="height: 66%"></span><span>02-14</span></div>

                <span>推荐问题：</span>

                <button data-suggest="上月平均拉平高度变化趋势" type="button">上月平均拉平高度变化趋势</button>
              </div>
            </div>
          </div>
        `;
        aiChatBody.scrollTop = 0;
      }

      function appendQuestion(question) {
        const bubble = document.createElement("div");
        bubble.className = "user-bubble";
        bubble.textContent = question;
        conversationMessages.querySelector("[data-welcome]")?.remove();
        conversationMessages.querySelector("[data-default-questions]")?.remove();
        conversationMessages.appendChild(bubble);

        const loading = document.createElement("div");
        loading.className = "assistant-response";
        loading.innerHTML = `
          <div class="response-avatar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor">
              <rect x="4" y="7" width="16" height="11" rx="3" />
              <path d="M9 7V4h6v3M8 12h.01M12 12h.01M16 12h.01" />
            </svg>
          </div>
          <div class="response-card loading">
            <span class="thinking">正在分析并生成结果</span>
          </div>

        aiChatBody.scrollTop = aiChatBody.scrollHeight;

        window.setTimeout(() => {
          loading.outerHTML = answerCardHtml(question);
          aiChatBody.scrollTop = aiChatBody.scrollHeight;
        }, 650);

        const value = question.trim();

        showToast("已发送问题，正在分析");

                  <path d="M7 15l4-5 3 3 5-7" />

              </span>
              <span><strong>近期航班拉平高度趋势</strong><span>快速查看航班关键趋势</span></span>

              </span>
              <span><strong>备降状态的航班有哪些</strong><span>查询备降相关航班明细</span></span>
            </button>
            <button class="quick-question-card" data-question="最近航班起降时间" type="button">

                  <path d="M4 19V5" />
                  <path d="M8 19v-7" />
                  <path d="M12 19V9" />
                  <path d="M16 19v-4" />
                  <path d="M20 19V7" />
                </svg>
              </span>
              <span><strong>最近航班起降时间</strong><span>汇总近期航班起飞和落地时间</span></span>
            </button>
          </div>
        `;
      }

      function setQuestion(value) {
        aiQuestion.value = value;
        aiQuestion.focus();
      }

      document.getElementById("aiLauncher").addEventListener("click", () => {
        aiService.classList.add("open");
      });

      document.querySelector("[data-ai-close]").addEventListener("click", () => {
        aiService.classList.remove("open", "expanded", "history-collapsed", "history-open");
      });

      document.querySelector("[data-ai-expand]").addEventListener("click", (event) => {
        aiService.classList.toggle("expanded");
        event.currentTarget.title = aiService.classList.contains("expanded") ? "恢复小窗" : "放大窗口";
      });

      document.querySelector("[data-ai-collapse]").addEventListener("click", () => {
        if (aiService.classList.contains("expanded")) {
          aiService.classList.toggle("history-collapsed");
          return;
        }
        aiService.classList.remove("history-open");
      });

      document.querySelectorAll("[data-ai-new]").forEach((button) => {
        button.addEventListener("click", () => {
          resetConversation();
          setQuestion("");
          aiService.classList.remove("history-open");
          showToast("已新建会话");
        });
      });

      document.querySelector("[data-ai-history]").addEventListener("click", () => {
        aiService.classList.toggle("history-open");
      });

      document.querySelector(".ai-search input").addEventListener("input", (event) => {
        const keyword = event.target.value.trim();
        document.querySelectorAll(".history-item").forEach((item) => {
          item.classList.toggle("hidden", keyword !== "" && !item.textContent.includes(keyword));
        });
      });

      document.querySelector(".ai-history").addEventListener("click", (event) => {
        const item = event.target.closest(".history-item");
        if (!item) return;
        askQuestion(item.textContent.replace("AI", "").trim());
      });

      document.querySelector(".ai-history").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const item = event.target.closest(".history-item");
        if (!item) return;
        event.preventDefault();
        askQuestion(item.textContent.replace("AI", "").trim());
      });

      aiChatBody.addEventListener("click", (event) => {
        const defaultQuestion = event.target.closest("[data-question]");
        if (defaultQuestion) {
          askQuestion(defaultQuestion.dataset.question);
          return;
        }

        const suggest = event.target.closest("[data-suggest]");
        if (suggest) {
          setQuestion(suggest.dataset.suggest);
          return;
        }

        const viewButton = event.target.closest("[data-view]");
        if (!viewButton) return;
        const card = viewButton.closest(".response-card");
        card.querySelectorAll("[data-view]").forEach((item) => item.classList.remove("active"));
        viewButton.classList.add("active");
        const isChart = viewButton.dataset.view === "chart";
        card.querySelector(".answer-table").style.display = isChart ? "none" : "table";
        card.querySelector(".mini-chart").classList.toggle("show", isChart);
      });

      document.querySelector("[data-ai-send]").addEventListener("click", () => {
        askQuestion(aiQuestion.value);
      });

      aiQuestion.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey) return;
        event.preventDefault();
        document.querySelector("[data-ai-send]").click();
      });

      document.querySelector("[data-upload-trigger]").addEventListener("click", () => {
        imageUpload.click();
      });

      imageUpload.addEventListener("change", () => {
        const file = imageUpload.files?.[0];
        if (!file) return;
        uploadChip.textContent = `已上传：${file.name}`;
        uploadChip.classList.add("show");
        showToast("图片已添加到本次提问");
      });

      document.querySelector("[data-model-toggle]").addEventListener("click", () => {
        modelPicker.classList.toggle("open");
      });

      modelPicker.addEventListener("click", (event) => {
        const option = event.target.closest("[data-model]");
        if (!option) return;
        modelPicker.querySelectorAll("[data-model]").forEach((item) => item.classList.remove("active"));
        option.classList.add("active");
        activeModel.textContent = option.dataset.model;
        modelPicker.classList.remove("open");
        showToast(`已选择模型：${option.dataset.model}`);
      });

      document.getElementById("clearAll").addEventListener("click", () => {
        document.querySelectorAll("[data-student]").forEach((panel) => {
          resetPanel(panel.dataset.student);
        });
        showToast("已清空全部学员内容");
      });

      document.getElementById("submitAll").addEventListener("click", () => {
        showToast("已确认完成，数据可上传");
      });

      updateProgress();
    </script>
  </body>
</html>
